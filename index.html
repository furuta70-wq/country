bel":"女性・男性の就業率","title":"女性・男性の就業率（15歳以上）","type":"gender","group":"society","index":3},{"key":"parliament","label":"女性議員の割合","title":"国会議員に占める女性の割合","unit":"％","digits":1,"group":"society","index":4},{"key":"internet","label":"ネットを使う人","unit":"％","digits":1,"group":"society","index":5},{"key":"climate","label":"主な気候","type":"list","group":"nature","index":0},{"key":"terrain","label":"自然・地形の特徴","type":"list","group":"nature","index":1},{"key":"conservation","label":"自然を守る取り組み","title":"自然を守る取り組みの例","type":"list","group":"nature","index":2},{"key":"wildlife","label":"特徴的な生き物","title":"特徴的な生き物の例","type":"list","group":"nature","index":3},{"key":"resources","label":"主な天然資源","type":"list","group":"nature","index":4},{"key":"hazards","label":"起こりやすい災害","type":"list","group":"nature","index":5},{"key":"crops","label":"主な農産物","type":"list","group":"industry","index":0},{"key":"exports","label":"主な輸出品","type":"list","group":"industry","index":1},{"key":"imports","label":"主な輸入品","type":"list","group":"industry","index":2},{"key":"strengths","label":"得意な産業・技術","type":"list","group":"industry","index":3},{"key":"tourism","label":"主な観光資源","type":"list","group":"industry","index":4},{"key":"cooperation","label":"他国との協力","title":"他国と協力する取り組みの例","type":"list","group":"industry","index":5},{"key":"water","label":"飲み水を得られる人","unit":"％","digits":1,"group":"environment","index":0},{"key":"sanitation","label":"衛生的なトイレ","title":"衛生的なトイレを利用できる人","unit":"％","digits":1,"group":"environment","index":1},{"key":"electricity","label":"電気を使える人","unit":"％","digits":1,"group":"environment","index":2},{"key":"power","label":"主な発電方法","type":"power","group":"environment","index":3},{"key":"renewable","label":"再生可能電力","title":"発電量に占める再生可能電力の割合","unit":"％","digits":1,"group":"environment","index":4},{"key":"co2","label":"1人あたりのCO₂","title":"1人あたりのCO₂排出量","unit":"トン／年","digits":1,"group":"environment","index":5}],"groups":[{"id":"people","label":"人口・暮らし","color":"#14737c","soft":"#e8f4f4","icon":"people","keys":["population","age","life","living","urban","immigrants"]},{"id":"culture","label":"食・文化","color":"#a64d36","soft":"#fcf0ea","icon":"culture","keys":["food","customs","language","religion","festivals","arts"]},{"id":"society","label":"教育・社会","color":"#365fa7","soft":"#edf2fc","icon":"society","keys":["secondary","schoolyears","inequality","employment","parliament","internet"]},{"id":"nature","label":"自然・資源","color":"#327249","soft":"#eaf5ec","icon":"nature","keys":["climate","terrain","conservation","wildlife","resources","hazards"]},{"id":"industry","label":"産業・国際協力","color":"#8d651d","soft":"#fbf4e5","icon":"industry","keys":["crops","exports","imports","strengths","tourism","cooperation"]},{"id":"environment","label":"環境・生活基盤","color":"#6954a0","soft":"#f3effb","icon":"environment","keys":["water","sanitation","electricity","power","renewable","co2"]}],"version":8,"checked":"2026-11-19"}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('dataset').textContent),$=s=>document.querySelector(s);
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iconPaths={
people:'<circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6M17 13a5 5 0 0 1 4 5v3"/>',
culture:'<path d="M3 12h18c0 5-3.5 8-9 8s-9-3-9-8ZM8 22h8M6 3l3 6M13 2l-1 7M20 3l-5 6"/>',
society:'<path d="M12 5c-3-2-6-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-4-1-7-1-10 1ZM12 5v15M5 8h3M5 12h3M16 8h3M16 12h3"/>',
nature:'<path d="m2 21 7-12 4 6 3-4 6 10H2ZM17 8c-4 0-6-2-6-6 5 0 8 1 8 4 0 3-2 4-4 4M13 4l4 4"/>',
industry:'<path d="M3 21V10l7 4v-4l7 4V3h4v18H3ZM6 18h1M11 18h1M16 18h1M17 7h4"/>',
environment:'<path d="M12 2C9 7 5 10 5 15a7 7 0 0 0 14 0c0-5-4-8-7-13ZM13 10l-4 6h5l-3 5"/>'};
const svg=id=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${iconPaths[id]}</svg>`;
const religions={Christians:'キリスト教',Muslims:'イスラム教',Hindus:'ヒンドゥー教',Buddhists:'仏教',Jews:'ユダヤ教','Other religions':'その他の宗教',Unaffiliated:'無宗教'};
const num=(v,d=1)=>Number(v).toLocaleString('ja-JP',{minimumFractionDigits:d,maximumFractionDigits:d});
const state={group:'people',metric:'living',memory:Object.fromEntries(DATA.groups.map(g=>[g.id,g.id==='people'?'living':g.keys[0]]))};


let viewportFrame=0,fitFrame=0;
function fitVisibleCards(){
 const fitting=document.body.classList.contains('fit-screen');
 for(const el of document.querySelectorAll('.datum')){
  el.style.removeProperty('--fitted-size');el.style.removeProperty('--fitted-number');el.style.removeProperty('gap');
  if(!fitting)continue;
  const overflows=()=>el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1||[...el.querySelectorAll('.data-row,.number-line')].some(x=>x.scrollWidth>x.clientWidth+1);
  if(el.classList.contains('text')||el.classList.contains('rows')){
   const row=el.querySelector('.data-row');let size=parseFloat(getComputedStyle(row||el).fontSize);
   const tighten=min=>{let gap=parseFloat(getComputedStyle(el).rowGap)||0;while(overflows()&&gap>min){gap=Math.max(min,gap-.5);el.style.gap=gap+'px'}};
   tighten(2);
   while(overflows()&&size>11){size=Math.max(11,size-.5);el.style.setProperty('--fitted-size',size+'px')}
   tighten(1);
  }else{
   const value=el.querySelector('.amount');if(!value)continue;
   let size=parseFloat(getComputedStyle(value).fontSize);
   while(overflows()&&size>24){size=Math.max(24,size-1);el.style.setProperty('--fitted-number',size+'px')}
  }
 }
}
function queueCardFit(){cancelAnimationFrame(fitFrame);fitFrame=requestAnimationFrame(fitVisibleCards)}
function updateViewport(){
 const vv=window.visualViewport;
 if(vv&&Math.abs(vv.scale-1)>.02)return;
 const width=window.innerWidth,height=Math.floor(Math.min(window.innerHeight,vv?vv.height:window.innerHeight));
 document.documentElement.style.setProperty('--visible-height',height+'px');
 document.body.classList.toggle('fit-screen',width>=720&&width>height);
 document.body.dataset.density=height<600?'tight':height<730?'compact':'regular';
 queueCardFit();
}
function queueViewportUpdate(){cancelAnimationFrame(viewportFrame);viewportFrame=requestAnimationFrame(updateViewport)}
window.addEventListener('resize',queueViewportUpdate,{passive:true});
window.addEventListener('orientationchange',queueViewportUpdate,{passive:true});
if(window.visualViewport)window.visualViewport.addEventListener('resize',queueViewportUpdate,{passive:true});
window.addEventListener('pageshow',queueViewportUpdate,{passive:true});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(queueCardFit);

function format(o,m){
 if(m.type==='money_month')return {value:num(o.v/10000,1),unit:'万円／月',approx:true};
 if(m.type==='inequality')return {value:num(o.v,1),unit:'ジニ指数／0〜100'};
 if(m.type==='population')return {value:num(o.v/10000,0),unit:'万人'};
 return {value:num(o.v,m.digits??1),unit:m.unit||''};
}
function amount(value){const [whole,decimal]=String(value).split('.');return esc(whole)+(decimal!==undefined?`<span class="decimal">.${esc(decimal)}</span>`:'')}
function religionData(o){const head=o.parts.slice(0,3).map(x=>({label:religions[x.key],v:x.v})),rest=o.parts.slice(3).reduce((s,x)=>s+x.v,0);return rest>=.05?head.concat({label:'ほか',v:rest,other:true}):head}
function rowMarkup(rows){return rows.map(r=>`<div class="data-row${r.other?' other':''}"><span class="row-label">${esc(r.label)}</span><span class="row-value">${r.v>0&&r.v<.1?'0.1<small>％未満</small>':num(r.v,1)+'<small>％</small>'}</span></div>`).join('')}

function paintDatum(el,o,m){
 if(m.type==='living'){el.className='datum numeric living';el.innerHTML=`<div class="number-line"><span class="approx">約</span><span class="amount">${amount(num(o.v/10000,1))}</span><span class="inline-unit">万円／月</span></div><div class="price-line"><span>外食1食</span><strong>約${num(o.meal,0)}<small>円</small></strong></div>`;return}
 if(m.type==='gender'){el.className='datum rows gender';el.innerHTML=rowMarkup(o.v);return}
 if(m.type==='inequality'){el.className='datum numeric inequality';el.innerHTML=`<div class="number-line"><span class="amount">${amount(num(o.v,1))}</span></div><div class="unit">ジニ指数／0〜100${o.basis?`<span class="basis">${esc(o.basis)}</span>`:''}</div>`;return}
 if(m.type==='list'){el.className='datum text';el.innerHTML=o.v.map(t=>`<span class="item">${esc(t)}</span>`).join('');return}
 if(m.type==='religion'||m.type==='power'){el.className='datum rows';el.innerHTML=rowMarkup(m.type==='religion'?religionData(o):o.v);return}
 const f=format(o,m);el.className='datum numeric';el.innerHTML=`<div class="number-line">${f.approx?'<span class="approx">約</span>':''}<span class="amount">${amount(f.value)}</span></div><div class="unit">${esc(f.unit)}</div>`;
}
function paintReference(o,m){
 const parent=$('#reference');let markup,cls='reference-value';
 if(m.type==='living'){cls+=' ref-text';markup=`<span>月収 約${num(o.v/10000,1)}万円</span><span>外食1食 約${num(o.meal,0)}円</span>`}
 else if(m.type==='gender'){cls+=' ref-text';markup=o.v.map(t=>`<span>${esc(t.label)} ${num(t.v,1)}％</span>`).join('')}
 else if(m.type==='inequality'){markup=`${num(o.v,1)}<small>ジニ指数</small>`}
 else if(m.type==='list'){cls+=' ref-text';markup=o.v.map(t=>`<span>${esc(t)}</span>`).join('')}
 else if(m.type==='religion'){const p=o.parts[0];markup=`${esc(religions[p.key])}<small>${num(p.v,1)}％</small>`}
 else if(m.type==='power'){cls+=' ref-text';markup=o.v.map(t=>`<span>${esc(t.label)} ${num(t.v,1)}％</span>`).join('')}
 else{const f=format(o,m);markup=`${f.approx?'約':''}${f.value}<small>${esc(f.unit)}</small>`}
 parent.innerHTML=`<div class="reference-label"><img class="flag" src="${DATA.japan.flag}" alt="日本の国旗"><span>日本</span></div><div class="${cls}">${markup}</div>`;
}
function paintMetrics(){
 const group=DATA.groups.find(g=>g.id===state.group);
 $('#metric-tabs').innerHTML=group.keys.map(key=>{const m=DATA.metrics.find(x=>x.key===key);return `<button type="button" class="metric" id="metric-${key}" role="tab" data-key="${key}" aria-selected="${key===state.metric}" aria-controls="grid" tabindex="${key===state.metric?0:-1}">${esc(m.label)}</button>`}).join('');
 $('#metric-tabs').setAttribute('aria-label',group.label+'の6項目');
}
function render(animate=true){
 const m=DATA.metrics.find(x=>x.key===state.metric),g=DATA.groups.find(x=>x.id===state.group);
 document.documentElement.style.setProperty('--accent',g.color);document.documentElement.style.setProperty('--soft',g.soft);
 for(const b of document.querySelectorAll('.category')){const active=b.dataset.group===state.group;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1}
 for(const b of document.querySelectorAll('.metric')){const active=b.dataset.key===state.metric;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1}
 // Finish the previous visual transition before replacing its content.
 for(const area of [$('#grid'),$('.context')]){if(typeof area.getAnimations==='function')for(const a of area.getAnimations({subtree:true}))a.cancel()}
 $('#metric-title').textContent=m.title||m.label;$('#grid').setAttribute('aria-labelledby','metric-'+m.key);paintReference(DATA.japan.values[m.key],m);
 const cards=[...document.querySelectorAll('.country')];
 cards.forEach((card,i)=>{card.dataset.content=m.type||'number';paintDatum(card.querySelector('.datum'),DATA.countries[i].values[m.key],m)});
 fitVisibleCards();
 if(animate){
  // These brief feedback effects intentionally work under either iPad motion preference.
  for(const target of [$('#metric-title'),$('#reference')]){if(typeof target.animate==='function')target.animate([{opacity:.35},{opacity:1}],{duration:160,easing:'ease-out'})}
  cards.forEach((card,i)=>{const el=card.querySelector('.datum');if(typeof el.animate==='function')el.animate([{opacity:.22},{opacity:1}],{duration:190,delay:Math.floor(i/6)*18,easing:'cubic-bezier(.2,.7,.2,1)',fill:'backwards'})});
 }
 $('#announcement').textContent=(m.title||m.label)+'。24カ国の表示を切り替えました。';
}
function selectGroup(id,focus=false){if(id===state.group)return;state.memory[state.group]=state.metric;state.group=id;state.metric=state.memory[id];paintMetrics();render();if(focus)document.querySelector(`.category[data-group="${id}"]`).focus()}
function selectMetric(key,focus=false){if(key===state.metric)return;state.metric=key;state.memory[state.group]=key;render();if(focus)document.querySelector(`.metric[data-key="${key}"]`).focus()}
function keyboardNav(e,kind){if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const list=[...e.currentTarget.querySelectorAll('button')],index=list.indexOf(e.target);if(index<0)return;e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?list.length-1:(index+(e.key==='ArrowRight'?1:-1)+list.length)%list.length;const b=list[next];if(kind==='group'){selectGroup(b.dataset.group);b.focus()}else{selectMetric(b.dataset.key);b.focus()}}
$('#category-tabs').innerHTML=DATA.groups.map(g=>`<button type="button" class="category" role="tab" data-group="${g.id}" aria-selected="false" aria-controls="metric-tabs" tabindex="-1">${svg(g.icon)}<span>${esc(g.label)}</span></button>`).join('');
$('#grid').innerHTML=DATA.countries.map(c=>`<article class="country" aria-label="${esc(c.name)}"><div class="country-head"><img class="flag" src="${c.flag}" alt=""><span class="country-name${c.name.length>7?' long':''}">${esc(c.name)}</span></div><div class="datum"></div></article>`).join('');
$('#category-tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-group]');if(b)selectGroup(b.dataset.group)});$('#metric-tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-key]');if(b)selectMetric(b.dataset.key)});
$('#category-tabs').addEventListener('keydown',e=>keyboardNav(e,'group'));$('#metric-tabs').addEventListener('keydown',e=>keyboardNav(e,'metric'));
updateViewport();paintMetrics();render(true);
</script>
</body>
</html>
